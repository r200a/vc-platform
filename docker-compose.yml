services:
  app:
    build: .
    container_name: vc-platform-app
    ports:
      - "8085:8085"
    env_file:
      - .env
    environment:
      - DB_URL=${DB_URL}  #postgres://postgres:postgres@host.docker.internal:5432/vc_platform_db?sslmode=disable # postgres://postgres:postgres@db:5432/vc_platform_db?sslmode=disable
      - PORT=8085
      - JWT_SECRET=${JWT_SECRET}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
      - S3_BUCKET=${S3_BUCKET}
      - KAFKA_BROKER=kafka:9092
    depends_on:
      - kafka
    #kafka:
    #   condition: service_healthy
    #  db:
    #    condition: service_healthy
    restart: on-failure

  zookeeper:
      image: confluentinc/cp-zookeeper:7.5.0
      container_name: vc-platform-zookeeper
      environment:
        ZOOKEEPER_CLIENT_PORT: 2181
        ZOOKEEPER_TICK_TIME: 2000
      healthcheck:
        test: ["CMD", "nc", "-z", "localhost", "2181"]
        interval: 10s
        timeout: 5s
        retries: 5
  
  kafka:
      image: confluentinc/cp-kafka:7.5.0
      container_name: vc-platform-kafka
      ports:
        - "9092:9092"
      environment:
        KAFKA_BROKER_ID: 1
        KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
        KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
        KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
        KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      depends_on:
        - zookeeper
      healthcheck:
        test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
        interval: 10s
        timeout: 10s
        retries: 10
  
  notification-service:
      build: ../notification-service
      container_name: vc-platform-notification
      environment:
        - KAFKA_BROKER=kafka:9092
        - KAFKA_TOPIC=application.events
        - KAFKA_GROUP_ID=notification-service
        - SENDGRID_API_KEY=${SENDGRID_API_KEY}
        - FROM_EMAIL=noreply@vcplatform.com
        - FROM_NAME=VC Platform
      depends_on:
        - kafka
      restart: on-failure
